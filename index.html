<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --ink:#202020; --paper:#f8f8f0; --s:2; color-scheme:dark; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; background:#1a1a2e; color:var(--ink); font-family:'Press Start 2P', monospace; overflow:hidden; user-select:none; -webkit-user-select:none; }
  #app { height:100%; overflow-y:auto; display:flex; flex-direction:column; align-items:center; gap:24px; padding:max(12px, env(safe-area-inset-top)) 0 max(12px, env(safe-area-inset-bottom)); }
  #app > :first-child { margin-top:auto; }
  #app > :last-child { margin-bottom:auto; }

  /* Game screen */
  #screen { position:relative; width:calc(160px * var(--s)); height:calc(144px * var(--s)); box-shadow:0 0 0 4px #000, 0 0 0 8px #3a3a52; border-radius:2px; background:#000; }
  #game { width:100%; height:100%; image-rendering:pixelated; display:block; }
  .win { background:var(--paper); border:calc(2px * var(--s)) solid var(--ink); border-radius:calc(2px * var(--s)); box-shadow:inset 0 0 0 calc(1px * var(--s)) var(--paper), inset 0 0 0 calc(2px * var(--s)) #6890c8; }
  #hud { position:absolute; top:calc(3px * var(--s)); left:calc(3px * var(--s)); padding:calc(3px * var(--s)) calc(4px * var(--s)); font-size:calc(5px * var(--s)); line-height:1.7; }
  #hud.low { top:auto; bottom:calc(1px * var(--s)); padding:calc(1px * var(--s)) calc(4px * var(--s)); line-height:1.4; }
  #gbanner { position:absolute; top:calc(3px * var(--s)); left:calc(30px * var(--s)); right:calc(3px * var(--s)); padding:calc(3px * var(--s)) calc(5px * var(--s)); font-size:calc(5px * var(--s)); line-height:1.6; cursor:pointer; z-index:2; animation:pop .25s steps(3); }
  #dialog { position:absolute; left:calc(2px * var(--s)); right:calc(2px * var(--s)); bottom:calc(2px * var(--s)); height:calc(46px * var(--s)); padding:calc(7px * var(--s)) calc(8px * var(--s)); font-size:calc(6px * var(--s)); line-height:1.8; cursor:pointer; }
  #dialog .more { position:absolute; right:calc(6px * var(--s)); bottom:calc(4px * var(--s)); font-size:calc(5px * var(--s)); animation:blink .7s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  #menu { position:absolute; top:calc(3px * var(--s)); right:calc(3px * var(--s)); width:calc(86px * var(--s)); padding:calc(5px * var(--s)) 0; font-size:calc(5px * var(--s)); }
  #menu.wide { width:calc(154px * var(--s)); }
  #menu div { position:relative; padding:calc(3px * var(--s)) calc(4px * var(--s)) calc(3px * var(--s)) calc(12px * var(--s)); cursor:pointer; }
  #menu div.sel::before { content:'\25B6'; position:absolute; left:calc(4px * var(--s)); }

  /* Controls */
  #pad { width:min(100%, 420px); display:grid; grid-template-columns:auto 1fr auto; align-items:center; padding:0 max(12px, env(safe-area-inset-left)); touch-action:none; }
  #pad button { touch-action:none; font-family:inherit; cursor:pointer; }
  #pad, #pad *, #screen, #screen * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .dpad { display:grid; grid-template-columns:repeat(3, min(44px, 12vw)); grid-template-rows:repeat(3, min(44px, 12vw)); }
  .dpad button { background:#34344a; border:none; color:#9090a8; font-size:14px; padding:0; }
  .dpad button:active { background:#4a4a66; }
  .dpad .up { grid-area:1/2; border-radius:6px 6px 0 0; } .dpad .left { grid-area:2/1; border-radius:6px 0 0 6px; }
  .dpad .right { grid-area:2/3; border-radius:0 6px 6px 0; } .dpad .down { grid-area:3/2; border-radius:0 0 6px 6px; }
  .dpad .mid { grid-area:2/2; background:#34344a; }
  .mid-btns { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .pill { font-size:8px; background:#4a4a5e; color:#d8d8e8; border:none; border-radius:12px; padding:8px 12px; }
  .pill:active { background:#62627a; }
  .ab { display:flex; gap:min(14px, 3vw); align-items:center; transform:rotate(-20deg); margin-right:6px; }
  .round { width:min(56px, 14vw); height:min(56px, 14vw); border-radius:50%; background:#b02a58; color:#fff; border:none; font-size:14px; box-shadow:0 4px 0 #6a1834; }
  .round:active { transform:translateY(3px); box-shadow:0 1px 0 #6a1834; }
  .round.b { margin-top:28px; }

  /* Building screens */
  #panel { position:fixed; inset:0; background:var(--paper); display:flex; flex-direction:column; z-index:20; user-select:text; -webkit-user-select:text; }
  .ph { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:calc(14px + env(safe-area-inset-top)) 16px 14px; color:#fff; border-bottom:4px solid var(--ink); font-size:14px; text-shadow:2px 2px 0 rgba(0,0,0,.35); }
  .ph button { text-shadow:none; }
  .pb { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .pb-inner { max-width:560px; margin:0 auto; padding:16px 16px calc(24px + env(safe-area-inset-bottom)); font-size:11px; line-height:1.9; }
  .box { background:#fff; border:3px solid var(--ink); box-shadow:inset 0 0 0 2px #fff, inset 0 0 0 4px #c8c8d0; padding:12px 14px; margin-bottom:14px; }
  .box h3 { margin:0 0 8px; font-size:11px; font-weight:normal; }
  .box p { margin:0; }
  .row { display:flex; justify-content:space-between; flex-wrap:wrap; gap:0 12px; }
  .neg { color:#c03030; }
  .muted { color:#8a8a94; }
  .banner { background:#f8e070; border:3px solid var(--ink); padding:8px 10px; margin-bottom:14px; font-size:9px; line-height:1.8; }
  .bar { height:16px; border:3px solid var(--ink); background:#fff; margin-top:6px; }
  .bar i { display:block; height:100%; background:#f0b830; }
  button.px { font-family:inherit; font-size:10px; background:#fff; color:var(--ink); border:3px solid var(--ink); padding:8px 10px; cursor:pointer; }
  button.px:active { background:#e8e8f0; }
  #panel, #names { color-scheme:light; }
  input.px { font-family:inherit; font-size:16px; border:3px solid var(--ink); padding:6px 8px; flex:1; min-width:0; border-radius:0; background:#fff; color:var(--ink); }
  .add { display:flex; gap:8px; margin-bottom:6px; }
  .err { color:#c03030; font-size:9px; margin:0 0 10px; }
  .check { display:flex; gap:10px; align-items:flex-start; padding:5px 0; cursor:pointer; }
  .check .bx { width:16px; height:16px; border:3px solid var(--ink); flex:none; margin-top:2px; background:#fff; }
  .check.done .bx { background:#48a058; }
  .check.done span { text-decoration:line-through; color:#8a8a94; }
  .day { padding:6px 0; border-bottom:2px dashed #d8d8e0; }
  .day:last-child { border-bottom:none; }
  .frames { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:14px; }
  .frame { border:6px solid #8a5a30; box-shadow:0 0 0 3px var(--ink); background:#fff; padding:6px; text-align:center; font-size:8px; }
  .frame .pic { height:80px; margin-bottom:6px; }
  button.frame { font-family:inherit; color:var(--ink); cursor:pointer; width:100%; }
  .frame img { width:100%; height:110px; object-fit:cover; display:block; margin-bottom:6px; }
  .viewer img { width:100%; max-height:60vh; object-fit:contain; background:#202020; display:block; }
  label.px { display:inline-block; font-family:inherit; font-size:10px; background:#fff; color:var(--ink); border:3px solid var(--ink); padding:8px 10px; cursor:pointer; }
  select.px { font-family:inherit; font-size:16px; border:3px solid var(--ink); padding:4px 6px; background:#fff; color:var(--ink); border-radius:0; max-width:100%; }
  .stack { display:flex; flex-direction:column; gap:10px; }
  .form-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .form-row > * { min-width:0; }
  button.mini { font-size:8px; padding:5px 7px; border-width:2px; }
  .txn { padding:7px 0; border-bottom:2px dashed #e0e0e8; align-items:flex-start; flex-wrap:nowrap; }
  .txn > span:first-child { min-width:0; flex:1; overflow-wrap:anywhere; }
  .txn select.px { font-size:12px; margin-top:4px; }
  .tick { display:flex; gap:8px; align-items:flex-start; cursor:pointer; }
  details summary { cursor:pointer; margin-top:10px; }

  /* Name entry */
  #toast { position:fixed; top:calc(64px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:40; background:#f8e070; color:var(--ink); border:3px solid var(--ink); padding:8px 12px; font-size:11px; white-space:nowrap; pointer-events:none; animation:pop .25s steps(3); }
  @keyframes pop { from { transform:translateX(-50%) scale(.6); } }
  #names { position:fixed; inset:0; z-index:30; background:#1a1a2e; display:flex; align-items:center; justify-content:center; padding:16px; }
  #names .win { width:min(100%, 380px); padding:22px; font-size:11px; line-height:1.9; }
  #names label { display:block; margin:14px 0 6px; }
  #names input { width:100%; }
  #names label.tick { display:flex; align-items:center; gap:10px; }
  #names input[type=radio] { width:auto; }

  /* ===== The family app (opens first; the town is behind a button) =====
     Layout: a calm one-column phone app; cards stacked on fog, tab bar at the bottom. */
  :root {
    --a-bg:#edf3f5; --a-card:#ffffff; --a-ink:#1c2a33; --a-soft:#5a6b76; --a-line:#d6e1e7;
    --a-bay:#24698f; --a-bay-soft:#dbeaf2; --a-kelp:#37845a; --a-kelp-soft:#dcefe3;
    --a-coral:#d9664c; --a-coral-soft:#fae2da; --a-sand:#f2e5c7; --a-gold:#b8871f;
    --f-display:'Pixelify Sans', 'Press Start 2P', system-ui, sans-serif; --f-body:'Nunito', system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --a-bg:#0d171e; --a-card:#15232c; --a-ink:#e3ecf1; --a-soft:#98adb9; --a-line:#243744;
    --a-bay:#72b4dc; --a-bay-soft:#173244; --a-kelp:#6cc48f; --a-kelp-soft:#163226;
    --a-coral:#f08d77; --a-coral-soft:#3a221d; --a-sand:#352e20; --a-gold:#e0b64c;
  } }
  :root[data-theme="dark"] {
    --a-bg:#0d171e; --a-card:#15232c; --a-ink:#e3ecf1; --a-soft:#98adb9; --a-line:#243744;
    --a-bay:#72b4dc; --a-bay-soft:#173244; --a-kelp:#6cc48f; --a-kelp-soft:#163226;
    --a-coral:#f08d77; --a-coral-soft:#3a221d; --a-sand:#352e20; --a-gold:#e0b64c;
  }
  #appView { position:fixed; inset:0; z-index:15; display:flex; flex-direction:column; background:var(--a-bg); color:var(--a-ink); font-family:var(--f-body); font-size:16px; line-height:1.45; user-select:text; -webkit-user-select:text; }
  #appView * { box-sizing:border-box; }
  .ah { padding:calc(14px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:600px; width:100%; margin:0 auto; }
  .ah h1 { font-family:var(--f-display); font-weight:700; font-size:24px; line-height:1.15; margin:0; text-wrap:balance; }
  .ah .sub { font-size:13px; color:var(--a-soft); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .sync-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--a-soft); }
  .sync-dot.live { background:var(--a-kelp); }
  .sync-dot.warn { background:var(--a-coral); }
  .town-btn { flex:none; display:flex; align-items:center; gap:8px; font-family:var(--f-display); font-weight:700; font-size:15px; color:#fff; background:var(--a-kelp); border:none; border-radius:12px; padding:10px 14px; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.18); }
  .town-btn:active { transform:translateY(2px); box-shadow:none; }
  #appMain { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .am-inner { max-width:600px; margin:0 auto; padding:4px max(16px, env(safe-area-inset-right)) 28px max(16px, env(safe-area-inset-left)); display:flex; flex-direction:column; gap:14px; }
  .card { background:var(--a-card); border:1px solid var(--a-line); border-radius:18px; padding:16px; min-width:0; }
  .card-h { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; }
  .eyebrow { font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--a-soft); }
  .link { background:none; border:none; color:var(--a-bay); font:inherit; font-weight:700; font-size:14px; cursor:pointer; padding:0; }
  .muted2 { color:var(--a-soft); font-size:14px; }
  .big-num { font-family:var(--f-display); font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; }
  .race { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; }
  .player { display:flex; align-items:center; gap:10px; min-width:0; }
  .player.right { flex-direction:row-reverse; text-align:right; }
  .player .nm { font-weight:800; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ava { width:40px; height:40px; object-fit:contain; object-position:center bottom; image-rendering:pixelated; background:var(--a-bay-soft); border-radius:12px; flex:none; }
  .crown-tag { font-size:11px; font-weight:800; color:var(--a-gold); letter-spacing:.06em; }
  .vs { font-family:var(--f-display); color:var(--a-soft); font-size:14px; }
  .bar2 { height:10px; background:var(--a-bay-soft); border-radius:99px; overflow:hidden; margin-top:6px; }
  .bar2 i { display:block; height:100%; background:var(--a-kelp); border-radius:99px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { font:inherit; font-size:14px; font-weight:700; color:var(--a-ink); background:var(--a-card); border:1px solid var(--a-line); border-radius:99px; padding:8px 12px; cursor:pointer; display:inline-flex; gap:6px; align-items:center; }
  .chip:active { transform:scale(.97); }
  .chip .pts { color:var(--a-kelp); font-weight:800; }
  .chip.soft { background:var(--a-bay-soft); border-color:transparent; color:var(--a-bay); }
  .chip.done { background:var(--a-kelp-soft); border-color:transparent; color:var(--a-kelp); }
  .quest-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--a-line); }
  .quest-row:first-of-type { border-top:none; }
  .quest-row .qbox { width:22px; height:22px; border-radius:7px; border:2px solid var(--a-line); display:grid; place-items:center; font-weight:900; color:#fff; flex:0 0 22px; }
  .quest-row.done .qbox { background:var(--a-kelp); border-color:var(--a-kelp); }
  .quest-row.done > span:nth-child(2) { color:var(--a-soft); text-decoration:line-through; }
  .care-line { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:5px 0; }
  .care-l { font-weight:800; }
  .chip.on { background:var(--a-bay); border-color:var(--a-bay); color:#fff; }
  .in { font:inherit; font-size:16px; color:var(--a-ink); background:var(--a-card); border:1px solid var(--a-line); border-radius:12px; padding:10px 12px; width:100%; min-width:0; }
  .in:focus { outline:2px solid var(--a-bay); outline-offset:1px; }
  textarea.in { resize:vertical; min-height:64px; }
  .row2 { display:flex; gap:8px; align-items:center; }
  .row2 > .in { flex:1; }
  .btn { font:inherit; font-weight:800; font-size:15px; border:none; border-radius:12px; padding:10px 14px; cursor:pointer; background:var(--a-bay); color:#fff; flex:none; }
  .btn.ghost { background:var(--a-bay-soft); color:var(--a-bay); }
  .btn.warn { background:var(--a-coral-soft); color:var(--a-coral); }
  .btn:active { transform:translateY(1px); }
  .item { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--a-line); }
  .item:first-child { border-top:none; }
  .item .txt { flex:1; min-width:0; overflow-wrap:anywhere; }
  .item .meta { font-size:13px; color:var(--a-soft); }
  .item.done .txt > span:first-child { text-decoration:line-through; color:var(--a-soft); }
  .box2 { width:24px; height:24px; border-radius:8px; border:2px solid var(--a-line); background:var(--a-card); flex:none; cursor:pointer; display:grid; place-items:center; padding:0; }
  .item.done .box2 { background:var(--a-kelp); border-color:var(--a-kelp); }
  .item.done .box2::after { content:''; width:10px; height:6px; border-left:3px solid #fff; border-bottom:3px solid #fff; transform:rotate(-45deg) translate(1px,-1px); }
  .x { background:none; border:none; color:var(--a-soft); font-size:18px; cursor:pointer; padding:4px 6px; }
  .seg { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
  .seg .chip { flex:none; }
  .chore-row { width:100%; text-align:left; font:inherit; color:inherit; background:none; border:none; border-top:1px solid var(--a-line); padding:11px 0; display:flex; align-items:center; gap:12px; cursor:pointer; }
  .chore-row:first-of-type { border-top:none; }
  .chore-row .txt { flex:1; min-width:0; }
  .chore-row .nm { font-weight:700; }
  .pill { font-size:13px; font-weight:800; border-radius:99px; padding:4px 10px; background:var(--a-kelp-soft); color:var(--a-kelp); flex:none; }
  .pill.maxed { background:var(--a-bay-soft); color:var(--a-soft); }
  .cgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(44px, 1fr)); gap:6px; }
  .ch { font:inherit; font-weight:800; font-size:14px; aspect-ratio:1; border-radius:10px; border:1px solid var(--a-line); background:var(--a-card); color:var(--a-ink); cursor:pointer; position:relative; overflow:hidden; padding:0; }
  .ch.me { background:linear-gradient(90deg, var(--a-bay-soft) 50%, var(--a-card) 50%); }
  .ch.them { background:linear-gradient(90deg, var(--a-card) 50%, var(--a-sand) 50%); }
  .ch.both { background:var(--a-kelp); border-color:var(--a-kelp); color:#fff; }
  .ch.sel { outline:3px solid var(--a-bay); outline-offset:1px; }
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:13px; color:var(--a-soft); margin-top:10px; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:4px; vertical-align:-2px; margin-right:4px; border:1px solid var(--a-line); }
  .books { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:6px; }
  .books .chip { justify-content:center; border-radius:12px; }
  .bubbles { display:flex; flex-direction:column; gap:10px; }
  .bub { max-width:82%; padding:10px 14px; border-radius:18px; background:var(--a-card); border:1px solid var(--a-line); align-self:flex-start; overflow-wrap:anywhere; }
  .bub.mine { align-self:flex-end; background:var(--a-bay-soft); border-color:transparent; }
  .bub .when { font-size:12px; color:var(--a-soft); margin-top:4px; display:flex; gap:8px; align-items:center; }
  .heart { background:none; border:none; cursor:pointer; color:var(--a-soft); font:inherit; font-size:13px; padding:0; }
  .heart.on { color:var(--a-coral); font-weight:800; }
  .town-card { background:#1e2a3a; color:#f2f4f8; border:none; }
  .town-card .eyebrow { color:#9fb4c8; }
  .town-card li { margin:4px 0; }
  .town-card ul { padding-left:18px; margin:6px 0 14px; }
  .gear-btn { flex:none; width:42px; height:42px; border-radius:14px; border:1px solid var(--a-line); background:var(--a-card); color:var(--a-soft); display:grid; place-items:center; cursor:pointer; margin-left:auto; margin-right:8px; }
  .ava-wrap { position:relative; display:inline-block; flex:none; line-height:0; }
  .ava-wrap .face { position:absolute; right:-4px; bottom:-4px; width:52%; height:52%; border-radius:50%; object-fit:cover; border:2px solid var(--a-card); box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .face-big { width:96px; height:96px; border-radius:50%; object-fit:cover; border:3px solid var(--a-card); box-shadow:0 2px 8px rgba(0,0,0,.15); }

<script>
const $ = id => document.getElementById(id);
const TILE = 16, MW = 60, MH = 66;
let VW = 10, VH = 9, SW = 160, SH = 144;   // the town view grows to fill the phone (see resize)
const canvas = $('game');
let ctx = canvas.getContext('2d');   // swapped briefly when drawing characters into other canvases
canvas.width = VW * TILE; canvas.height = VH * TILE;

const LOCAL_ONLY = new Set(['recapSeen', 'introSeen', 'seen', 'sound', 'notesSeen', 'crowned', 'me', 'tab', 'bibleSeen', 'lastEnc', 'ciAsked']);
const sync = { db: null, ready: false, userId: null, status: 'local', dirty: new Set(), busy: new Set(), timers: {}, vals: {}, pendingRefresh: false };
const store = {

};

const mem = {};
const load = (k, d) => (mem[k] ??= store.get(k, d));
const save = k => store.set(k, mem[k]);

function queueWrite(k) { clearTimeout(sync.timers[k]); sync.timers[k] = setTimeout(() => flushKey(k), 300); }
async function flushKey(k) {

  try { await sync.db.doc('kv/' + k).set({ v: JSON.parse(JSON.stringify(sync.vals[k] ?? null)) }); }
  catch (e) {
    if (e && e.code === 'invalid_argument') { sync.status = 'readonly'; setSyncBadge(); }
    else if (e && e.code !== 'revoked') sync.dirty.add(k);
  }

  if (sync.dirty.has(k) && sync.status !== 'readonly') queueWrite(k);
}
// Lists where both of you add items (chat, calendar, chores) merge item by item instead of
// last-write-wins, so two things added at the same moment both survive.
const MERGE_KEYS = { photolog: p => p.id, bcomments: c => c.id, notes: n => n.id, events: e => e.id, chorelog: e => `${e.at}|${e.id}|${e.by}`, bigGoals: g => g.id, goals: g => g.id, prayers: p => p.id };
const tomb = {};                // item keys deleted on this phone, so a merge doesn't bring them back
const recent = {};              // item keys this phone added in the last minute
function noteAdded(k, item) { (recent[k] = recent[k] || new Map()).set(MERGE_KEYS[k](item), Date.now()); }
function noteRemoved(k, item) { (tomb[k] = tomb[k] || new Set()).add(MERGE_KEYS[k](item)); }
function mergeLists(k, remote, local) {
  const id = MERGE_KEYS[k], dead = tomb[k] || new Set(), out = new Map();
  for (const it of remote || []) if (!dead.has(id(it))) out.set(id(it), it);
  for (const it of local || []) if (!dead.has(id(it))) out.set(id(it), it);   // this phone's version of an item wins
  return [...out.values()];
}
// Something changed on the other phone: take it, unless this phone has a newer edit waiting to send.
function applyRemote(k, v, force) {
  if (LOCAL_ONLY.has(k)) return false;
  if (MERGE_KEYS[k] && Array.isArray(v)) {
    const pending = sync.dirty.has(k) || sync.busy.has(k), mine = recent[k], cutoff = Date.now() - 60000;
    const missing = mine && [...mine].some(([key, t]) => t > cutoff && !v.some(it => MERGE_KEYS[k](it) === key));
    if (pending || missing) {
      const local = mem[k] || [], fresh = missing ? local.filter(it => mine.get(MERGE_KEYS[k](it)) > cutoff) : local;
      mem[k] = mergeLists(k, JSON.parse(JSON.stringify(v)), pending ? local : fresh);
      sync.vals[k] = mem[k]; store.cache(k, mem[k]); sync.dirty.add(k); if (sync.ready) queueWrite(k);
      return true;
    }
  }
  if (!force && (sync.dirty.has(k) || sync.busy.has(k))) return false;
  const val = v == null ? null : JSON.parse(JSON.stringify(v));
  mem[k] = val; sync.vals[k] = val; store.cache(k, val);
  if (k === 'names') names = val;
  if (k === 'margo') margoWith = val ?? 0;
  if (k === 'score' || k === 'pts0' || k === 'pts1') score = readScore();
  if (k === 'notes') setTimeout(onNewMessages, 0);
  if (k === 'bcomments') setTimeout(onNewComments, 0);

}
async function startSync() {
  if (!window.claude || !window.claude.use) return;
  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  if (!db) return;
  sync.db = db; sync.status = 'connecting'; setSyncBadge();
  if (user) sync.userId = await user.id();
  const slow = setTimeout(() => { if (!sync.ready) { sync.status = 'slow'; setSyncBadge(); } }, 10000);
  db.collection('kv').onSnapshot(snap => {
    let changed = false;
    if (!sync.ready && !snap.metadata.fromCache) {
      // First full answer: the shared town wins for everything it already has...
      clearTimeout(slow);
      const onServer = new Set();
      for (const d of snap.docs) { onServer.add(d.id); sync.dirty.delete(d.id); applyRemote(d.id, d.data().v, true); }
      // ...and anything only this phone has (its first time connecting) gets shared.
      try { for (const lk of Object.keys(localStorage)) { const k = lk.slice(3); if (lk.startsWith('ft_') && !LOCAL_ONLY.has(k) && !onServer.has(k)) { sync.vals[k] = memOr(k, null); sync.dirty.add(k); } } } catch (e) { /* no local storage */ }
      for (const k of Object.keys(mem)) if (!LOCAL_ONLY.has(k) && !onServer.has(k)) { sync.vals[k] = mem[k]; sync.dirty.add(k); }
      sync.ready = true; sync.status = 'live'; setSyncBadge();
      for (const k of sync.dirty) queueWrite(k);
      identify();
      changed = true;
    } else {
      for (const ch of snap.docChanges()) if (ch.type !== 'removed') changed = applyRemote(ch.doc.id, ch.doc.data().v) || changed;
    }
    if (changed) refreshViews();
  }, () => { clearTimeout(slow); sync.status = sync.ready ? 'offline' : 'local'; setSyncBadge(); });
}

// Who is holding this phone: each person claims a player slot once, by their claude.ai identity.
function identify() {
  const players = load('players', { ids: [null, null] });
  const slot = sync.userId ? players.ids.indexOf(sync.userId) : -1;
  if (slot >= 0) { active = slot; store.set('me', slot); updateHud(); renderApp(); return; }
  if (!sync.userId || sync.status === 'readonly') return;
  const open = [0, 1].filter(i => !players.ids[i]);
  if (open.length === 1) { claimSlot(open[0]); updateHud(); renderApp(); appToast(`Welcome, ${titleCase(nameOf(open[0]))}!`); return; }
  sheet = { kind: 'whoami' }; renderSheet();   // first time on this account: one tap, then never again
}
function claimSlot(slot) {
  active = slot; store.set('me', slot);
  if (sync.userId) {
    const players = load('players', { ids: [null, null] });
    players.ids = players.ids.map(id => (id === sync.userId ? null : id));
    players.ids[slot] = sync.userId; save('players');
  }
}

const sfx = (() => {
  let ac = null, musicTimer = null, step = 0;
  const prefs = () => load('sound', { fx: true, music: false });
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, dur, type = 'square', vol = .05, when = 0, slideTo) {
    const a = audio();
    if (!a) return;
    const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
  }
  const notes = (list, gap, dur, type = 'square', vol = .05) => list.forEach((f, i) => tone(f, dur, type, vol, i * gap));
  const SOUNDS = {
    text: () => tone(1200, .02, 'square', .02),
    blip: () => tone(880, .05, 'square', .04),
    select: () => notes([660, 990], .06, .08),
    back: () => tone(440, .09, 'square', .04, 0, 300),
    door: () => notes([330, 440, 550], .07, .1),
    coin: () => notes([988, 1319], .07, .15, 'square', .045),
    bad: () => tone(220, .22, 'sawtooth', .04, 0, 110),
    catch: () => notes([523, 659, 784, 1047], .07, .09),
    sleep: () => notes([784, 659, 523, 392], .28, .3, 'triangle', .07),
    bark: () => { tone(320, .08, 'sawtooth', .06, 0, 180); tone(340, .1, 'sawtooth', .06, .13, 170); },
    arf: () => { tone(230, .13, 'sawtooth', .06, 0, 150); tone(240, .13, 'sawtooth', .06, .2, 140); tone(235, .15, 'sawtooth', .06, .4, 140); },
    hi: () => notes([523, 784], .08, .1, 'triangle', .07),
    spout: () => tone(180, .7, 'sine', .07, 0, 60),
    meow: () => { tone(620, .16, 'triangle', .08, 0, 900); tone(900, .22, 'triangle', .08, .16, 480); },
  };
  // An original little town theme: C, G, Am, F, C, G, F, G
  const MELODY = [72, 76, 79, 76, 77, 74, 71, 74, 72, 76, 79, 84, 83, 79, 77, 0, 76, 79, 81, 79, 77, 74, 72, 74, 76, 72, 74, 71, 72, 0, 0, 0];
  const BASS = [48, 43, 45, 41, 48, 43, 41, 43];
  const hz = n => 440 * Math.pow(2, (n - 69) / 12);
  function syncMusic() {
    const on = prefs().music;
    if (on && !musicTimer && audio()) {
      musicTimer = setInterval(() => {
        if (document.hidden) return;
        const n = MELODY[step % MELODY.length];
        if (n) tone(hz(n), .17, 'square', .02);
        if (step % 4 === 0) tone(hz(BASS[(step / 4) % BASS.length]), .5, 'triangle', .05);

    prefs, tone, syncMusic,
    play(name) { if (prefs().fx && ac) try { SOUNDS[name](); } catch (e) { /* sound is optional */ } },
    toggle(kind) { const p = prefs(); p[kind] = !p[kind]; mem.sound = p; save('sound'); if (kind === 'music') syncMusic(); },
  };
})();

}
const isGrassy = t => t === 'G' || t === 'F' || t === 'T' || t === 'S' || t === 'B' || t === 'Y';

function drawGrass(X, Y, x, y) {

  if (r % 3 === 0) { px(w, X+3, Y+5, 1, 2, d); px(w, X+5, Y+4, 1, 3, d); px(w, X+4, Y+6, 1, 1, d); }

function drawPath(X, Y, x, y) {

  const e = '#c4a868';
  if (isGrassy(map[y-1]?.[x])) px(w, X, Y, 16, 1, e);

}

    } catch (e) { rej(e); }

  const run = async (txMode, fn) => {

      t.oncomplete = () => res(req.result); t.onerror = () => rej(t.error);
    });
  };
  return { all: () => run('readonly', s => s.getAll()), put: p => run('readwrite', s => s.put(p)), del: id => run('readwrite', s => s.delete(id)) };

  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Not an image')); };
    img.src = url;

    items.push({ t, done: false }); added++;
    capAward('groceries_add', 30, 3); track('grocery');
  }

}
function margoAge(b) {
  const born = new Date(b + 'T00:00'), now = startOfToday();
  if (born > now) return "MARGO'S BIRTHDAY IS COMING UP!";
  let months = (now.getFullYear() - born.getFullYear()) * 12 + now.getMonth() - born.getMonth();
  if (now.getDate() < born.getDate()) months--;
  if (months >= 24) return `MARGO IS ${Math.floor(months / 12)} YEARS OLD.`;
  const anchor = new Date(born); anchor.setMonth(born.getMonth() + months);
  const weeks = Math.floor((now - anchor) / (7 * 864e5));
  return `MARGO IS ${months} MONTH${months === 1 ? '' : 'S'}${weeks ? ` AND ${weeks} WEEK${weeks === 1 ? '' : 'S'}` : ''} OLD.`;
}

// opts.add and opts.done are { pts, cap, ev }. Uncapped "done" points come back off if you uncheck the item.
function listScreen(key, defaults, heading, placeholder, opts) {
  const { add, done } = opts;
  return {
    render() {
      const items = load(key, defaults);
      const who = it => it.done && it.by != null ? ` <em class="muted" style="font-style:normal">(${esc(nameOf(it.by))})</em>` : '';
      const list = items.map((it, i) => `<div class="check ${it.done ? 'done' : ''}" data-i="${i}"><div class="bx"></div><span>${esc(it.t)}${who(it)}</span></div>`).join('');
      return `<div class="box"><h3>${heading()}</h3>${list || '<p class="muted">NOTHING HERE YET.</p>'}</div>
        <form class="add"><input class="px" placeholder="${placeholder}" maxlength="60"><button class="px">ADD</button></form>
        <p class="err" hidden>TYPE SOMETHING FIRST.</p>
        <button class="px clear">CLEAR FINISHED</button>`;
    },
    bind(body) {
      const items = load(key, defaults);
      body.querySelectorAll('.check').forEach(el => el.addEventListener('click', () => {
        const it = items[+el.dataset.i];
        it.done = !it.done;
        if (it.done) {
          it.by = active;
          if (!done.cap) addPoints(active, done.pts);
          else if (!it.awarded) { it.awarded = true; capAward(key + '_done', done.cap, done.pts); }
          if (!it.counted) { it.counted = true; track(done.ev); }
        } else {
          if (!done.cap && it.by != null) addPoints(it.by, -done.pts);
          delete it.by;
        }
        save(key); renderPanel();
      }));
      const form = body.querySelector('.add'), input = form.querySelector('input'), err = body.querySelector('.err');
      input.addEventListener('input', () => { err.hidden = true; });
      form.addEventListener('submit', e => {
        e.preventDefault();
        const t = input.value.trim();
        if (!t) { err.hidden = false; return; }
        items.push({ t, done: false }); save(key);
        capAward(key + '_add', add.cap, add.pts); track(add.ev); renderPanel();
        body.querySelector('.add input').focus();
      });
      body.querySelector('.clear').addEventListener('click', () => { mem[key] = items.filter(i => !i.done); save(key); renderPanel(); });
    },
  };
}

function updateArcade(dt) {
  arc.time -= dt;
  const d = heldDirs[heldDirs.length - 1], speed = running ? 110 : 75;
  if (d === 'left' || d === 'right') { arc.x += (d === 'left' ? -1 : 1) * speed * dt; arc.dir = d; arc.walkT += dt; } else arc.walkT = 0;
  arc.x = Math.max(0, Math.min(144, arc.x));
  arc.spawn -= dt;
  if (arc.spawn <= 0) {
    const r = Math.random(), elapsed = 30 - arc.time;
    arc.items.push({ x: 4 + Math.random() * 144, y: -10, kind: r < .2 ? 'diaper' : r < .3 ? 'rattle' : 'bottle', v: 38 + elapsed * 1.5 + Math.random() * 15 });
    arc.spawn = .75 - elapsed * .012;

  for (const it of arc.items) {
    it.y += it.v * dt;
    if (it.y > 104 && it.y < 122 && Math.abs(it.x + 4 - (arc.x + 8)) < 11) {

      arc.score = Math.max(0, arc.score + (it.kind === 'bottle' ? 1 : it.kind === 'rattle' ? 3 : -2));
      arc.flash = { kind: it.kind, t: .25 };

  arc.items = arc.items.filter(it => !it.hit && it.y < 150);
  if (arc.flash && (arc.flash.t -= dt) <= 0) arc.flash = null;
  updateHud();
  if (arc.time <= 0) endArcade(false);
}

// ---------- Weekly stats: high scores, days in the app, and the Sunday awards ----------
// Each of you writes only your own key (wk0 / wk1), so two phones never overwrite each other.
const HI_GAMES = { gull: 'Gull Glide', run: 'Moose Run', surf: 'Bay Surf', castle: 'Sandcastle Stack', hoops: 'Basketball', arcade: 'Midnight Snack', tennis: 'Tennis', pong: 'Ping Pong', pickle: 'Pickleball', bowl: 'Bowling', fish: 'Fishing', pk: 'Soccer' };
const HI_PTS = 10;   // real points for the week's top score in each game
function myWeek() {
  const k = 'wk' + active, w = load(k, null) || { week: weekKey(), best: {}, days: [] };
  if (w.week !== weekKey()) { w.prev = { week: w.week, best: w.best, days: w.days }; w.week = weekKey(); w.best = {}; w.days = []; }
  mem[k] = w; return w;
}
function weekStats(i, week) {
  const w = memOr('wk' + i, null);
  if (!w) return { best: {}, days: [] };
  return w.week === week ? w : w.prev && w.prev.week === week ? w.prev : { best: {}, days: [] };
}
function recordScore(game, n) {
  track(['tennis', 'pickle', 'pong', 'bowl'].includes(game) ? 'play_rec' : 'play_' + game);
  const w = myWeek(), old = w.best[game] || 0;
  if (n <= old) return false;
  w.best[game] = n; save('wk' + active); track('newbest'); return true;
}
function markDay() { const w = myWeek(), d = dateKey(new Date()); if (!w.days.includes(d)) { w.days.push(d); save('wk' + active); } }
function hiBonus(week) {
  const a = weekStats(0, week).best, b = weekStats(1, week).best, out = [0, 0], wins = [];
  for (const g of Object.keys(HI_GAMES)) {
    const x = a[g] || 0, y = b[g] || 0; if (!x && !y) continue;
    if (x > y) { out[0] += HI_PTS; wins.push([g, 0, x, y]); } else if (y > x) { out[1] += HI_PTS; wins.push([g, 1, y, x]); } else { out[0] += HI_PTS / 2; out[1] += HI_PTS / 2; wins.push([g, -1, x, y]); }
  }
  return { pts: out, wins };
}
function hiScoresText() {
  const w = weekKey(), a = weekStats(0, w).best, b = weekStats(1, w).best, rows = Object.keys(HI_GAMES).filter(g => a[g] || b[g]);
  if (!rows.length) return ['No high scores yet this week. Play anything in PLAY to set one!', `Top score in each game wins ${HI_PTS} real points on Sunday.`];
  return [`THIS WEEK'S HIGH SCORES (top score in each game = +${HI_PTS} PTS on Sunday)`, ...rows.map(g => `${HI_GAMES[g].toUpperCase()}: ${nameOf(0)} ${a[g] || 0}, ${nameOf(1)} ${b[g] || 0}`)];
}

// ---------- Gull Glide: tap to flap through the pier posts ----------
function gullGlide() {
  const g = { y: 60, vy: 0, posts: [], t: 0, spawn: 0, score: 0, state: 'ready', dead: 0, speed: 52, pickups: [], best: myWeek().best.gull || 0, flap: 0 };
  const GAP0 = 50, W = 14;
  const finish = () => {
    endMini();
    const e = capAward('gull', 20, Math.floor(g.score / 2));
    const nb = recordScore('gull', g.score); track('arcadeplay');
    say([`You glided past ${g.score} pier post${g.score === 1 ? '' : 's'}!${nb ? ' NEW WEEKLY BEST!' : ''}`, e ? `+${e} shells.` : 'No shells left today, but your high score still counts!']);
  };
  const crash = () => { if (g.state !== 'fly') return; g.state = 'dead'; g.dead = 0; sfx.play('bad'); };
  return {
    hud: () => `GULL GLIDE<br>SCORE ${g.score} BEST ${Math.max(g.best, g.score)}`,
    update(dt) {
      g.t += dt; g.flap = Math.max(0, g.flap - dt);
      if (g.state === 'ready') { g.y = 60 + Math.sin(g.t * 3) * 4; return; }
      if (g.state === 'dead') { g.dead += dt; g.vy += 300 * dt; g.y = Math.min(124, g.y + g.vy * dt); if (g.dead > 1.4) g.state = 'over'; return; }
      if (g.state === 'over') return;
      g.vy += 330 * dt; g.y += g.vy * dt;
      g.speed = 52 + Math.min(48, g.score * 1.6);
      const gap = Math.max(34, GAP0 - g.score * .7);
      if ((g.spawn -= dt) <= 0) { g.spawn = 92 / g.speed + .55; const top = 14 + Math.random() * (100 - gap); g.posts.push({ x: 164, top, gap, passed: false, wob: g.score > 12 ? (Math.random() * 2 - 1) * 10 : 0 });
        if (Math.random() < .35) g.pickups.push({ x: 164 + 46, y: 20 + Math.random() * 90 }); }
      for (const p of g.posts) { p.x -= g.speed * dt; if (p.wob) p.top += Math.sin(g.t * 2 + p.x / 20) * p.wob * dt;
        if (!p.passed && p.x + W < 40) { p.passed = true; g.score++; sfx.play('blip'); }
        if (p.x < 48 && p.x + W > 36 && (g.y < p.top || g.y + 8 > p.top + p.gap)) crash(); }
      for (const k of g.pickups) { k.x -= g.speed * dt; if (!k.got && Math.abs(k.x - 42) < 8 && Math.abs(k.y - g.y - 4) < 8) { k.got = true; g.score += 2; sfx.play('coin'); } }
      g.posts = g.posts.filter(p => p.x > -20); g.pickups = g.pickups.filter(k => k.x > -10 && !k.got);
      if (g.y < 0 || g.y > 118) crash();
    },
    a() {
      if (g.state === 'ready') { g.state = 'fly'; g.vy = -110; return; }
      if (g.state === 'fly') { g.vy = -112; g.flap = .15; sfx.play('text'); return; }
      if (g.state === 'over') finish();
    },
    quit() { if (g.state === 'fly' || g.state === 'ready') { g.state = 'over'; } finish(); },
    render() {
      px(ctx, 0, 0, 160, 144, '#88b8e0');
      for (let i = 0; i < 6; i++) px(ctx, 0, i * 16, 160, 16, ['#f8c890', '#f8b880', '#f0a878', '#c8a0b8', '#98a8d0', '#88b8e0'][i]);
      const off = (g.t * g.speed * .2) % 160;
      for (let k = 0; k < 2; k++) { const hx = -off + k * 160; px(ctx, hx, 92, 160, 10, '#6a7a98'); px(ctx, hx + 20, 86, 40, 8, '#6a7a98'); px(ctx, hx + 90, 84, 50, 10, '#5a6a88'); }
      px(ctx, 0, 118, 160, 26, '#2f6f9f'); for (let i = 0; i < 10; i++) px(ctx, ((i * 37 - g.t * g.speed) % 170 + 170) % 170 - 5, 122 + (i % 3) * 6, 8, 1, '#8fc8f0');
      for (const p of g.posts) { const x = Math.round(p.x), t = Math.round(p.top), b = Math.round(p.top + p.gap);
        px(ctx, x - 1, 0, W + 2, t + 1, '#202020'); px(ctx, x, 0, W, t, '#8a5a32'); px(ctx, x + 2, 0, 2, t, '#a87a4a'); px(ctx, x - 3, t - 5, W + 6, 5, '#5e3b1e');
        px(ctx, x - 1, b - 1, W + 2, 144 - b, '#202020'); px(ctx, x, b, W, 144 - b, '#8a5a32'); px(ctx, x + 2, b, 2, 144 - b, '#a87a4a'); px(ctx, x - 3, b, W + 6, 5, '#5e3b1e'); }
      for (const k of g.pickups) { const x = Math.round(k.x), y = Math.round(k.y); px(ctx, x - 3, y - 2, 7, 5, '#202020'); px(ctx, x - 2, y - 1, 5, 3, '#f8d0c0'); px(ctx, x, y - 2, 1, 1, '#f8f0e8'); }
      const y = Math.round(g.y), wing = g.flap > 0 || Math.floor(g.t * 8) % 2 ? -3 : 2;
      px(ctx, 36, y + 2, 12, 6, '#202020'); px(ctx, 37, y + 3, 10, 4, '#f8f8f8'); px(ctx, 46, y + 3, 3, 2, '#f0a020'); px(ctx, 44, y + 3, 1, 1, '#202020');
      px(ctx, 38, y + 3 + wing, 7, 2, '#a8b0b8'); px(ctx, 34, y + 4, 3, 2, '#505058');
      if (g.state === 'ready') { txt('GULL GLIDE', 80, 24, '#f8f8f8'); txt('TAP A TO FLAP', 80, 96, '#f8f8f8'); }
      if (g.state === 'over') { px(ctx, 24, 44, 112, 46, '#202020'); px(ctx, 26, 46, 108, 42, '#f8f8f0'); txt(`SCORE ${g.score}`, 80, 52, '#202020'); txt(`BEST ${Math.max(g.best, g.score)}`, 80, 64, '#3a86b8'); txt('A: DONE', 80, 76, '#d04848'); }
      else if (g.state !== 'ready') txt(String(g.score), 80, 6, '#f8f8f8');
    },
  };

// ---------- Sandcastle Stack: drop each layer of sand right on top. Perfect drops keep the castle wide ----------
function castleStack() {
  const g = { layers: [{ x: 46, w: 68 }], cur: null, dir: 1, speed: 46, state: 'ready', falls: [], perfect: 0, combo: 0, flash: 0, t: 0, cam: 0, best: myWeek().best.castle || 0, over: 0 };
  const H = 8, BASE = 128;
  const score = () => g.layers.length - 1 + g.perfect * 2;
  const next = () => { const top = g.layers[g.layers.length - 1]; g.dir = g.layers.length % 2 ? 1 : -1; g.cur = { x: g.dir > 0 ? -Math.round(top.w / 2) : 160 - Math.round(top.w / 2), w: top.w }; g.speed = Math.min(140, 46 + g.layers.length * 4); };
  const finish = () => {
    endMini();
    const sc = score(), e = capAward('castle', 14, Math.floor(sc / 3)), nb = recordScore('castle', sc);
    say([`Your sandcastle is ${g.layers.length - 1} layers tall${g.perfect ? ` with ${g.perfect} perfect drops` : ''}!${nb ? ' NEW WEEKLY BEST!' : ''}`, e ? `+${e} shells.` : 'No shells left today, but your high score still counts!']);
  };
  return {
    g,
    hud: () => `SANDCASTLE<br>SCORE ${score()} BEST ${Math.max(g.best, score())}`,
    update(dt) {
      g.t += dt; if (g.flash > 0) g.flash -= dt;
      for (const f of g.falls) { f.vy += 300 * dt; f.y += f.vy * dt; }
      g.falls = g.falls.filter(f => f.y < 200);
      const want = Math.max(0, (g.layers.length - 9) * H); g.cam += (want - g.cam) * Math.min(1, dt * 4);
      if (g.state !== 'run' || !g.cur) return;
      g.cur.x += g.dir * g.speed * dt;
      if (g.cur.x > 160 - g.cur.w + 20 && g.dir > 0) g.dir = -1;
      if (g.cur.x < -20 && g.dir < 0) g.dir = 1;
    },
    a() {
      if (g.state === 'ready') { g.state = 'run'; next(); return; }
      if (g.state === 'over') { if (!g.falls.length) finish(); return; }
      if (g.state !== 'run') return;
      const top = g.layers[g.layers.length - 1], c = g.cur, y = BASE - g.layers.length * H;
      if (Math.abs(c.x - top.x) <= 2) { c.x = top.x; g.perfect++; g.combo++; g.flash = .5; sfx.play('catch');
        if (g.combo >= 3 && c.w < 68) { c.w = Math.min(68, c.w + 4); c.x = Math.max(0, c.x - 2); } }
      else {
        g.combo = 0;
        const l = Math.max(c.x, top.x), r = Math.min(c.x + c.w, top.x + top.w);
        if (r - l <= 0) { g.falls.push({ x: c.x, w: c.w, y, vy: 0 }); g.cur = null; g.state = 'over'; sfx.play('bad'); return; }
        if (c.x < l) g.falls.push({ x: c.x, w: l - c.x, y, vy: 0 }); if (c.x + c.w > r) g.falls.push({ x: r, w: c.x + c.w - r, y, vy: 0 });
        c.x = l; c.w = r - l; sfx.play('text');
      }
      g.layers.push({ x: c.x, w: c.w }); next();
    },
    quit() { g.state = 'over'; finish(); },
    render() {
      px(ctx, 0, 0, 160, 144, '#a8d8f0'); px(ctx, 0, 70, 160, 20, '#2a7ab0'); px(ctx, 0, 70, 160, 2, '#f0f8fc');
      const cam = Math.round(g.cam), sand = (x, y, w, top) => { px(ctx, x, y, w, H, '#a88858'); px(ctx, x, y, w, H - 1, '#e0c890'); px(ctx, x, y + 3, w, 1, '#d0b478');
        if (top) for (let i = 0; i < w - 2; i += 6) px(ctx, x + i + 1, y - 3, 3, 3, '#e0c890'); };
      px(ctx, 0, BASE + cam, 160, 40, '#e8d8a8'); for (let i = 0; i < 160; i += 12) px(ctx, i + (i % 24 ? 3 : 8), BASE + 6 + cam, 3, 1, '#c8b080');
      g.layers.forEach((l, i) => { if (i) sand(Math.round(l.x), BASE - i * H + cam, Math.round(l.w), i === g.layers.length - 1 && g.state === 'over'); });
      if (g.layers.length > 1) { const t = g.layers[g.layers.length - 1], ty = BASE - (g.layers.length - 1) * H + cam; for (let i = 6; i < 30 && g.layers.length > 4; i += 30) { px(ctx, Math.round(t.x + t.w / 2), ty - 12, 1, 12, '#5a4030'); px(ctx, Math.round(t.x + t.w / 2) + 1, ty - 12, 6, 4, '#d04848'); } }
      for (let i = 4; i < g.layers.length; i += 4) { const l = g.layers[i]; px(ctx, Math.round(l.x + l.w / 2) - 2, BASE - i * H + cam + 2, 4, 5, '#7a5a38'); }   // little doors and windows
      for (const f of g.falls) sand(Math.round(f.x), Math.round(f.y) + cam, Math.round(f.w));
      if (g.cur) sand(Math.round(g.cur.x), BASE - g.layers.length * H + cam, Math.round(g.cur.w));
      // a bucket and spade for scale
      px(ctx, 140, BASE - 10 + cam, 12, 10, '#202020'); px(ctx, 141, BASE - 9 + cam, 10, 9, '#e04848'); px(ctx, 140, BASE - 12 + cam, 12, 2, '#202020');
      if (g.flash > 0) txt(g.combo >= 3 ? 'PERFECT! WIDER!' : 'PERFECT!', 80, 22, '#d04848');
      if (g.state === 'ready') { px(ctx, 14, 14, 132, 40, '#202020'); px(ctx, 16, 16, 128, 36, '#f8f8f0'); txt('SANDCASTLE STACK', 80, 20, '#202020'); txt('A: DROP THE SAND', 80, 32, '#202020'); txt('LINE IT UP EXACTLY!', 80, 42, '#d04848'); }
      if (g.state === 'over' && !g.falls.length) { px(ctx, 24, 30, 112, 46, '#202020'); px(ctx, 26, 32, 108, 42, '#f8f8f0'); txt(`SCORE ${score()}`, 80, 38, '#202020'); txt(`BEST ${Math.max(g.best, score())}`, 80, 50, '#3a86b8'); txt('A: DONE', 80, 62, '#d04848'); }
      else if (g.state === 'run') txt(String(score()), 80, 6, '#202020');
    },
  };
}
const startSurf = () => say(['BAY SURF: Ride the wave! UP and DOWN to move.', 'Press A at the very top for an air trick. Dodge kelp, rocks, and seals!'], () => startMini(baySurf()));

// A timing mini-game: a marker swings back and forth; tap A when it's in the green.
function timingGame(o) {
  const g = { tries: 5, hits: 0, x: 0, v: 1.6, flash: 0, done: 0, zone: [.4, .6] };
  const finish = () => { endMini(); const got = g.hits ? capAward(o.game, o.cap, g.hits) : 0; track(o.game);
    say([o.done(g.hits), got ? `+${got} SHELLS!` : g.hits ? capMsg(o.cap) : 'Give it another go!']); };
  return {
    hud: () => `${o.title}<br>${g.hits} OF 5 · ${g.tries} LEFT`,
    update(dt) {
      g.x += g.v * dt; if (g.x > 1) { g.x = 1; g.v = -g.v; } if (g.x < 0) { g.x = 0; g.v = -g.v; }
      if (g.flash) g.flash = Math.max(0, g.flash - dt);
      if (g.done && (g.done -= dt) <= 0) finish();
    },
    a() {
      if (g.done || !g.tries) return;
      g.tries--; const hit = g.x >= g.zone[0] && g.x <= g.zone[1];
      if (hit) { g.hits++; g.flash = .4; if (sfx.prefs().fx) sfx.tone(o.tone, .35, 'triangle', .08); const w = Math.max(.08, (g.zone[1] - g.zone[0]) * .8), c = .25 + Math.random() * .5; g.zone = [c - w / 2, c + w / 2]; g.v *= 1.15; }
      else sfx.play('back');
      if (!g.tries) g.done = .8;
    },
    quit() { endMini(); say(['Maybe later.']); },
    render() {
      renderInside();
      if (g.flash) { px(ctx, o.at.x * 16 - 4, o.at.y * 16 - 8, 24, 3, '#f8e060'); px(ctx, o.at.x * 16 - 2, o.at.y * 16 - 12, 20, 2, '#f8e060'); }
      px(ctx, 8, 96, 144, 44, '#202020'); px(ctx, 10, 98, 140, 40, '#f8f8f0');
      ctx.font = '8px "Press Start 2P", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = '#202020';
      ctx.fillText(g.done ? `${g.hits} OF 5!` : o.verb, 80, 102);
      px(ctx, 20, 114, 120, 8, '#202020'); px(ctx, 22, 116, 116, 4, '#d8d0c0');
      px(ctx, 22 + Math.round(116 * g.zone[0]), 116, Math.max(2, Math.round(116 * (g.zone[1] - g.zone[0]))), 4, '#48a058');
      px(ctx, 22 + Math.round(114 * g.x), 112, 2, 12, '#d04848');
      ctx.fillStyle = '#808088'; ctx.fillText('TAP A IN THE GREEN', 80, 126);
    },
  };
}

// ----- drawing the rooms (once each), then people on top every frame -----
const insideCanvases = {};
function insideCanvas(id) {
  if (insideCanvases[id]) return insideCanvases[id];
  const R = INSIDE[id], cv = document.createElement('canvas'); cv.width = 160; cv.height = 144;
  const h = cv.getContext('2d'), P = (x, y, wd, ht, col) => { h.fillStyle = col; h.fillRect(x, y, wd, ht); };
  const floor = (X, Y, x, y) => {
    if (R.floor === 'tile') { P(X, Y, 16, 16, '#c87850'); P(X, Y, 16, 1, '#a85a38'); P(X, Y, 1, 16, '#a85a38'); if ((x + y) % 2) P(X + 4, Y + 4, 8, 8, '#d08860'); }
    else if (R.floor === 'check') { P(X, Y, 16, 16, (x + y) % 2 ? '#f0ece0' : '#c8d8c0'); }
    else if (R.floor === 'boards') { P(X, Y, 16, 16, '#9aa8b0'); for (let i = 0; i < 16; i += 4) P(X, Y + i, 16, 1, '#7a8890'); P(X + (x * 5 + y * 3) % 14, Y + 1, 1, 3, '#7a8890'); }
    else { P(X, Y, 16, 16, '#b88858'); for (let i = (y % 2) * 2; i < 16; i += 4) P(X, Y + i, 16, 1, '#a07040'); }
  };
  for (const pass of [0, 1]) R.map.forEach((row, y) => [...row].forEach((t, x) => {
    const X = x * 16, Y = y * 16;
    if (t === '#') {
      if (pass) return;
      if (y === 0) { P(X, Y, 16, 16, R.wall); P(X, Y + 13, 16, 3, R.trim); return; }
      P(X, Y, 16, 16, '#5a4030'); P(X + (x === 0 ? 13 : 0), Y, 3, 16, R.trim); return;
    }
    if (pass === 0) {
      floor(X, Y, x, y);
      if (t === 'm') { P(X, Y, 16, 16, '#5a4030'); P(X + 2, Y, 12, 6, '#7a8a5a'); P(X + 3, Y + 1, 10, 4, '#98a878'); }
      if (id === 'chapel' && t === '.' && x >= 3 && x <= 6 && y >= 2) { P(X + 2, Y, 12, 16, '#a83838'); P(X + 2, Y, 1, 16, '#c8a050'); P(X + 13, Y, 1, 16, '#c8a050'); }   // the aisle runner
      return;
    }
    // furniture and stations

// Bowling: five frames each. Aim with the moving arrow, then set your power.

    hud: () => g.phase === 'wait' ? `WAITING FOR<br>${esc(nameOf(1 - active))}` : `FRAME ${Math.min(FRAMES, Math.floor(g.turn / (together ? 2 : 1)) + 1)}/${FRAMES}<br>${myTurn() ? 'YOUR ROLL' : esc(nameOf(1 - active)) + ' ROLLS'}`,

// Show an encouragement for at least `min` ms, until `until()` is true (or `max`), then fade and run `then`.
let splashTimer = null;
function showSplash({ town = false, min = 2000, max = 4000, until = null, then = null } = {}) {
  const [text, ref] = pickEncouragement(), el = $('splash');
  $('spText').textContent = text; $('spRef').textContent = ref;
  $('spSub').textContent = town ? 'Heading into Family Town...' : 'Family Town';
  el.classList.toggle('town', town); el.classList.remove('fade'); el.hidden = false;
  const started = Date.now();
  let finished = false;
  const done = () => {
    if (finished) return;
    finished = true; clearInterval(splashTimer);
    el.classList.add('fade'); setTimeout(() => { if (finished) el.hidden = true; }, 380);
    if (then) then();
  };
  $('spGo').onclick = done;
  clearInterval(splashTimer);
  splashTimer = setInterval(() => { const e = Date.now() - started; if ((e >= min && (!until || until())) || e >= max) done(); }, 100);
}

function resizeToBlob(file, max) {

    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Not an image')); };
    img.src = url;

}

    case 'toggle': toggleListItem(d.key, +d.i); renderApp(); break;
    case 'dellist': { const items = listItems(d.key); items.splice(+d.i, 1); save(d.key); renderApp(); break; }
    case 'clearlist': mem[d.key] = listItems(d.key).filter(it => !it.done); save(d.key); renderApp(); break;
    case 'staple': {
      const t = d.t;
      if (listItems('groceries').some(it => !it.done && it.t.toLowerCase() === t.toLowerCase())) { appToast(`${t} is already on the list`); break; }
      addListItem('groceries', t); appToast(`${t} added`); renderApp(); break;
    }
    case 'goal': bumpGoal(d.id, +d.d); renderApp(); break;
    case 'delgoal': { const g = load('goals', []).find(x => x.id === d.id); if (g) noteRemoved('goals', g); mem.goals = load('goals', []).filter(x => x.id !== d.id); save('goals'); renderApp(); break; }
    case 'tolist': { const meal = mealPlan().days[+d.i], n = addToGroceries(meal.ingredients.split(',').map(s => s.trim()).filter(Boolean)); appToast(n ? `${n} added to groceries` : 'Already on the grocery list'); renderApp(); break; }
    case 'editgoal': case 'editgoal2': editGoal = !editGoal; renderApp(); break;
    case 'editmission': editGoal = editGoal === 'mission' ? false : 'mission'; renderApp(); break;
    case 'delvalue': { const m = mission(); m.values.splice(+d.i, 1); save('mission'); renderApp(); break; }
    case 'delbig': { const g = bigGoals().find(x => x.id === d.id); if (g) noteRemoved('bigGoals', g); mem.bigGoals = bigGoals().filter(x => x.id !== d.id); save('bigGoals'); renderApp(); break; }
    case 'bigstep': {
      const g = bigGoals().find(x => x.id === d.id), s = g && g.steps[+d.i];
      if (!s) break;
      s.done = !s.done;
      if (s.done) track('goal');
      const all = g.steps.length && g.steps.every(x => x.done);
      if (all && !g.done) { g.done = true; g.doneAt = Date.now(); addPoints(active, 25); appToast(`"${g.t}" accomplished! A new flag flies in town. +25`); }
      else if (!all) g.done = false;
      save('bigGoals'); renderApp(); break;
    }
    case 'book': startBook(+d.i); renderApp(); break;
    case 'pickbook': pickingBook = true; renderApp(); break;
    case 'cancelbook': pickingBook = false; renderApp(); break;
    case 'selch': bibleSel = +d.ch; renderApp(); break;
    case 'gocomment': appTab = 'us'; usTab = 'bible'; bibleSel = +d.ch; renderApp(); break;
    case 'heartc': { const c = bcomments().find(x => x.id === d.id); if (c) { c.hearts = (c.hearts || []).includes(active) ? c.hearts.filter(h => h !== active) : [...(c.hearts || []), active]; save('bcomments'); } renderApp(); break; }
    case 'delc': { const c = bcomments().find(x => x.id === d.id && x.by === active); if (c) { noteRemoved('bcomments', c); mem.bcomments = bcomments().filter(x => x.id !== d.id); save('bcomments'); } renderApp(); break; }
    case 'ciedit': editCheckin = !editCheckin; renderApp(); break;
    case 'wardwho': wardWho = d.who; pendingBuy = null; renderApp(); break;
    case 'look': setLook(d.k, d.v); renderApp(); break;
    case 'shirt': tapShirt(d.id); renderApp(); break;
    case 'buydance': tapDance(d.id); renderApp(); break;
    case 'missionstart': { const m = startMission(d.id); if (m) appToast(`Mission started! ${partnerName()} got a message with their part.`); renderApp(); break; }
    case 'missiondrop': abandonMission(); renderApp(); break;
    case 'dealagree': { const it = crownDeals().items.find(x => x.id === d.id); if (it) { it.agree = it.agree || [false, false]; it.agree[active] = true; save('crownDeals'); } renderApp(); break; }
    case 'dealdel': { const dd = crownDeals(); dd.items = dd.items.filter(x => x.id !== d.id); save('crownDeals'); renderApp(); break; }
    case 'owedone': { const o = crownDeals().owed.find(x => x.id === d.id); if (o) { o.done = true; save('crownDeals'); appToast('Paid in full. Well done!'); } renderApp(); break; }
    case 'planouting': {
      const it = listItems('outings')[+d.i], ex = it && it.eventId && load('events', []).find(x => x.id === it.eventId);
      const sat = new Date(); sat.setDate(sat.getDate() + ((6 - sat.getDay() + 7) % 7 || 7));
      openEventSheet(ex ? ex.id : null, null, ex ? null : { title: it.t, date: dateKey(sat), who: 2, note: 'From your outing ideas' });
      sheet.fromOuting = +d.i; renderSheet(); break;
    }
    case 'readch': markChapter(+d.ch, d.off !== '1'); renderApp(); break;
    case 'faceoff': { const fc = faces(); delete fc[active]; mem.faces = fc; save('faces'); renderApp(); break; }
    case 'sndtoggle': sfx.toggle(d.k); renderApp(); break;
    case 'replayintro': pendingIntro = true; townGreeted = false; showTown(); break;
    case 'openrecap': mem.recapSeen = lastWeekKey(); save('recapSeen'); appTab = 'us'; usTab = 'recap'; renderApp(); break;
    case 'claim': claimSlot(+d.slot); sheet = null; renderSheet(); updateHud(); appToast(`Hi, ${titleCase(nameOf(+d.slot))}! This account is yours now.`); setTimeout(promptCheckin, 500); break;
    case 'esvread': {
      const q = d.q; sheet = { kind: 'esv', q }; renderSheet();
      FT_WEB.esv(q).then(r => { if (sheet && sheet.q === q) { sheet.html = r.html; sheet.title = r.title || q; renderSheet(); } })
        .catch(e => { if (sheet && sheet.q === q) { sheet.err = e.message; renderSheet(); } });
      break;
    }
    case 'icsub': FT_WEB.calendarUrl().then(u => { if (u) location.href = u; else appToast("Couldn't make the calendar link. Try again in a moment."); }); break;
    case 'famcode': FT_WEB.familyCode().then(c => appToast(c ? `Your family code: ${c}` : 'No code found.')); break;
    case 'signout': FT_WEB.signOut(); break;
    case 'heart': { const n = notesList().find(x => x.id === d.id); if (n) { n.hearts = (n.hearts || []).includes(active) ? n.hearts.filter(h => h !== active) : [...(n.hearts || []), active]; save('notes'); } renderApp(); break; }
    case 'selday': calSel = d.k; { const dd = new Date(d.k + 'T00:00'); if (dd.getMonth() !== calMonth.m) calMonth = { y: dd.getFullYear(), m: dd.getMonth() }; } renderApp(); break;
    case 'calmove': { const dd = new Date(calMonth.y, calMonth.m + +d.d, 1); calMonth = { y: dd.getFullYear(), m: dd.getMonth() }; renderApp(); break; }
    case 'caltoday': { const dd = new Date(); calMonth = { y: dd.getFullYear(), m: dd.getMonth() }; calSel = dateKey(dd); renderApp(); break; }
    case 'calfilter': { const w = +d.w; if (calHide.has(w)) calHide.delete(w); else calHide.add(w); renderApp(); break; }
    case 'newev': openEventSheet(null, d.k); break;
    case 'editev': openEventSheet(d.id); break;
    case 'openev': { const ev = load('events', []).find(x => x.id === d.id); if (ev) { calSel = ev.date; const dd = new Date(ev.date + 'T00:00'); calMonth = { y: dd.getFullYear(), m: dd.getMonth() }; appTab = 'calendar'; renderApp(); openEventSheet(ev.id); } break; }
    case 'delev': {
      const ev = load('events', []).find(x => x.id === d.id);
      if (ev) { noteRemoved('events', ev); mem.events = load('events', []).filter(x => x.id !== d.id); save('events'); appToast(`Deleted "${ev.title}"`); }
      sheet = null; renderSheet(); renderApp(); break;
    }
    case 'closesheet': sheet = null; renderSheet(); break;
    case 'plus': sheet = { kind: 'plus' }; renderSheet(); break;
    case 'stickers': showStickers = !showStickers; renderApp(); break;
    case 'sticker': postChat({ type: 'sticker', text: d.s }); showStickers = false; renderApp(); break;
    case 'invite': {
      postChat({ type: 'invite', game: d.game }); sheet = null; renderSheet();
      appToast(`Invite sent. Head to ${GAMES[d.game].place}!`); renderApp(); break;
    }
    case 'joingame': showTown(GAMES[d.game] ? GAMES[d.game].spot : null); break;
    case 'sharegroc': {
      const open = listItems('groceries').filter(it => !it.done).map(it => it.t);
      postChat({ text: open.length ? `Grocery list: ${open.join(', ')}` : 'The grocery list is empty!' }); sheet = null; renderSheet(); appTab = 'chat'; renderApp(); break;
    }
  }
}
$('appMain').addEventListener('click', onAppClick);
$('aSheet').addEventListener('click', onAppClick);
function onAppSubmit(e) {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const v = name => (f.elements[name] ? String(f.elements[name].value).trim() : '');
  switch (f.dataset.form) {
    case 'add': {
      if (!v('t')) return;
      addListItem(f.dataset.key, v('t'), f.dataset.key === 'quests' && v('when') ? { when: v('when') } : undefined);
      appToast('Added'); break;
    }
    case 'note': if (!v('text')) return; sendNote(v('text')); if (appTab !== 'chat') appToast(`Sent to ${partnerName()}`); break;
    case 'petcare': {
      if (!v('name')) return;
      const p = { id: uid(), name: v('name'), every: Math.max(1, Math.min(365, parseInt(v('every'), 10) || 30)), last: null };
      mem.petcare = [...petCare(), p]; save('petcare'); appToast('Added. Tap Done the next time you do it.'); break;
    }
    case 'goal': {
      if (!v('t')) return;
      const g = { id: uid(), t: v('t'), target: Math.max(1, Math.min(50, parseInt(v('target'), 10) || 1)), period: v('period') || 'week', prog: {}, done: {}, by: active };
      load('goals', []).push(g); noteAdded('goals', g); save('goals'); break;
    }
    case 'goalcfg': { const fg = familyGoal(); fg.reward = v('reward') || fg.reward; fg.target = Math.max(10, parseInt(v('target'), 10) || fg.target); save('familyGoal'); editGoal = false; break; }
    case 'meal': {
      if (!v('dish')) return;
      const m = mealPlan(), day = +v('day'), isNew = !m.days[day];
      m.days[day] = { dish: v('dish'), ingredients: v('ing') }; save('meals');
      if (isNew) { capAward('meal', 9, 3); track('meal'); }
      appToast('Dinner saved'); break;
    }
    case 'checkin': {
      const mood = (f.querySelector('input[name=mood]:checked') || {}).value || '';
      if (!mood && !v('feel')) { const er = f.querySelector('#ciErr'); if (er) er.hidden = false; return; }
      saveCheckin({ mood, feel: v('feel'), thankful: v('thankful'), pray: v('pray') });
      editCheckin = false; if (sheet && sheet.kind === 'checkin') { sheet = null; renderSheet(); } appToast(`Check-in shared with ${partnerName()}`); break;
    }
    case 'bcomment': {
      if (!v('text')) return;
      postComment(bible().book, +f.dataset.ch, v('text'), v('verse').replace(/[^0-9-]/g, ''));
      appToast('Comment posted'); break;
    }
    case 'refl': {
      if (!v('text')) return;
      const b = bible(), c = +f.dataset.ch;
      b.refl[c] = [...(b.refl[c] || []), { by: active, text: v('text'), at: Date.now() }]; save('bible'); break;
    }
    case 'myname': { const n = v('n').trim().slice(0, 10); if (!n) return; names = [...names]; names[active] = n.toUpperCase(); mem.names = names; save('names'); for (const k in avatarCache) delete avatarCache[k]; appToast('Name saved'); break; }
    case 'weekfocus': mem.weekFocus = { week: weekKey(), text: v('t').trim() }; save('weekFocus'); appToast('Saved. It shows at the top of Home all week.'); break;
    case 'plan': {
      const t = v('t').trim(); if (!t) return;
      if (v('kind') === 'event') { const all = load('events', []), ev = { id: uid(), by: active, at: Date.now(), title: t, date: v('date') || dateKey(new Date()), who: 2, end: '', time: '', endTime: '', repeat: '', note: 'Planned in the Sunday recap' };
        all.push(ev); noteAdded('events', ev); save('events'); appToast(`On the calendar for ${evWhen(ev)}`); }
      else { addListItem(v('kind'), t); appToast(v('kind') === 'groceries' ? 'Added to groceries' : 'Added to to-dos'); }
      break;
    }
    case 'deal': { if (!v('t')) return; crownDeals().items.push({ id: uid(), text: v('t'), agree: [active === 0, active === 1], by: active }); save('crownDeals'); appToast(`Suggested. ${partnerName()} needs to agree.`); break; }
    case 'mission': { const m = mission(); m.text = v('text'); save('mission'); editGoal = false; appToast('Mission saved. It\'s carved into the plaza stone.'); break; }
    case 'value': { if (!v('v')) return; const m = mission(); if (m.values.length < 8) m.values.push(v('v')); save('mission'); break; }
    case 'biggoal': { if (!v('t')) return; const g = { id: uid(), t: v('t'), steps: [], done: false, by: active, at: Date.now() }; bigGoals().push(g); noteAdded('bigGoals', g); save('bigGoals'); break; }
    case 'bigstep': { if (!v('t')) return; const g = bigGoals().find(x => x.id === f.dataset.id); if (g) { g.steps.push({ t: v('t'), done: false }); g.done = false; save('bigGoals'); } break; }
    case 'event': {
      if (!v('title') || !v('date')) return;
      const all = load('events', []), old = all.find(x => x.id === sheet.ev.id), allday = f.elements.allday.checked;
      const ev = { ...(old || { id: sheet.ev.id, by: active, at: Date.now() }), title: v('title'), date: v('date'), end: v('end') && v('end') > v('date') ? v('end') : '',
        time: allday ? '' : v('time'), endTime: allday ? '' : v('endTime'), who: +(f.querySelector('input[name=who]:checked') || { value: 2 }).value, repeat: v('repeat'), note: v('note') };
      if (old) Object.assign(old, ev); else { all.push(ev); noteAdded('events', ev); capAward('event', 15, 5); track('event'); }
      save('events');
      if (!old) postChat({ type: 'event', eventId: ev.id });
      if (sheet.fromOuting != null) { const oi = listItems('outings')[sheet.fromOuting]; if (oi) { oi.eventId = ev.id; save('outings'); } }
      calSel = ev.date; sheet = null; renderSheet();
      appToast(old ? 'Event updated' : `Added to the calendar. ${partnerName()} will see it.`); break;
    }
  }
  renderApp();
}
$('appMain').addEventListener('submit', onAppSubmit);
// Mood chips light up as you pick one (without re-rendering, so typed text stays put)
function onAppChange(e) {
  if (e.target.dataset && e.target.dataset.photo && e.target.files && e.target.files[0]) { takeDailyPhoto(e.target.files[0], e.target.dataset.photo); return; }
  if (e.target.dataset && e.target.dataset.face && e.target.files && e.target.files[0]) {
    resizeToBlob(e.target.files[0], 200).then(pic => { const fc = faces(); fc[active] = pic.dataUrl; mem.faces = fc; save('faces'); renderApp(); appToast('Photo saved'); }).catch(() => appToast("That photo couldn't be read."));
    return;
  }
  if (e.target.name !== 'mood') return;
  e.target.closest('form').querySelectorAll('.moods .chip').forEach(l => l.classList.toggle('on', l.querySelector('input').checked));
}
$('appMain').addEventListener('change', onAppChange);
$('aSheet').addEventListener('change', onAppChange);
$('aSheet').addEventListener('submit', onAppSubmit);

// ---------- Town greeting: short, so you can get straight to playing ----------
function greetingLines() {
  const lines = [];
  if (HALLOWEEN) lines.push('HAPPY HALLOWEEN! Margo is dressed as a tiny pumpkin.');
  if (CHRISTMAS) lines.push('MERRY CHRISTMAS from Family Town!');
  const bday = load('margoBday', '');
  if (bday && bday.slice(5) === dateKey(new Date()).slice(5)) lines.push('HAPPY BIRTHDAY, MARGO! The whole town is celebrating!');
  const ci = todayCheckin(1 - active);
  if (ci && (ci.mood || ci.feel)) lines.push(`${nameOf(1 - active)} is feeling ${(ci.mood || ci.feel).toLowerCase()} today.${ci.thankful ? ' Thankful for ' + ci.thankful.slice(0, 30) + '.' : ''}`.slice(0, 70));
  const note = unreadNotes()[0];
  if (note) lines.push(`A note from ${nameOf(note.by)}: "${note.text.slice(0, 44)}${note.text.length > 44 ? '...' : ''}"`);
  lines.push(`TODAY IN TOWN: ${HAPPENING_NOW[0].title}, and more!`);
  return lines.slice(0, 4);
}
let townGreeted = false;
function greetTown() {
  if (townGreeted) return;
  townGreeted = true;
  if (pendingIntro) { pendingIntro = false; say(INTRO_LINES()); return; }
  say([`Welcome to town, ${nameOf(active)}!`, ...crowning(), ...greetingLines()]);
}
showSplash({ min: 2200, max: 4500, until: () => sync.ready || !sync.db || sync.status !== 'connecting', then: () => setTimeout(promptCheckin, 300) });
loadLocalPics();
setTimeout(markDay, 2500);
if (!store.get('introSeen', false)) { pendingIntro = true; store.cache('introSeen', true); }
renderApp();
startSync();
startRoom();
setInterval(() => { try { missionTick(); zoneWelcome(); } catch (e) { /* keep the town running */ } }, 400);
setTimeout(() => claimMissions(), 3000);
requestAnimationFrame(loop);
</script>
